<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Circle - Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <script type="text/javascript" src="validation.js" defer></script>
</head>
<body>

    <a href="studyCircle.html">
    <header>
        <img class="logo" src="images/scLogo.JPG" alt="logo"></imgclass>
    </header>
    </a>
    
    <div class="wrapper">
        <b><title>Sign Up</title></b>
        <p id = "error-message"></p>

        <form id="signUp_form">
    
        
            <div>
                <input type="text" id="name_input" name="name" size="70" placeholder="Name" style="height:50px; text-align: center; background-color: white; font-size: 20px;">
            </div>

            <div>
                <input type="email" id="email_input" name="email" size="70" placeholder="Email" style="height:50px; text-align: center; background-color: white; font-size: 20px;">
            </div>

            <div>
                <input type="password" id="password_input" name="password" size="70" placeholder="Password" style="height:50px; text-align: center; background-color: white; font-size: 20px;">
            </div>
            
            <div>
                <input type="password" id="confirm_password_input" name="confirm_password" size="70" placeholder="Confirm Password" style="height:50px; text-align: center; background-color: white; font-size: 20px;">
            </div>

            <div>
                <nav>
                    <a class="sign_up" href="dashboard.html"><button>Sign Up</button></a>

                    <h4>Already have an Account?<a href="logIn.html">Log In</a></h4>
                    
                </nav>

                
            </div>
        </form>
    </div>

</body>
</html>
