<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Circle - Log In</title>
    <link rel="stylesheet" href="logIn.css">
    <script type="text/javascript" src="validation.js" defer></script>
</head>

<body>
    
    <a href="studyCircle.html">
    <header>
        <img class="logo" src="images/scLogo.JPG" alt="logo"></imgclass>
    </header>
    </a>

    <div class="wrapper">

        
        <b><title>Log In</title></b>
        
        <p id = "error-message"></p>

        <form id="signUp_form">
    
            <div>
                <input type="email" id="email_input" name="email" size="70" placeholder="Email" style="height:50px; text-align: center; background-color: white; font-size: 20px;">
            </div>

            <div>
                <input type="password" id="password_input" name="password" size="70" placeholder="Password" style="height:50px; text-align: center; background-color: white; font-size: 20px;">
            </div>
            
        
            <div>
                <nav>
                     <a class="log_in" href="dashboard.html"><button>Log In</button></a>

                     <ul><a href="forgotPassowrd.html">Forgot Password</a></ul>
                     <h4>No Account? <a href="signUp.html">Sign Up</a></h4>
                    
                </nav>

                
            </div>
        </form>
    </div>

</body>
